[project]
name = "bliss"
version = "0.1.0"
description = "A local workspace for making manhwa recap videos."
requires-python = ">=3.11,<3.12"
dependencies = [
    "edge-tts==7.3.1",
    "fastapi",
    "pillow==10.4.0",
    "pymupdf==1.28.2",
    "uvicorn",
]

[project.optional-dependencies]
detection = [
    "torch==2.7.1",
    "ultralytics==8.3.174",
    "rapidocr-onnxruntime==1.4.4",
]
